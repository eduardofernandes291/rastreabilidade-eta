<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>Rastreabilidade de Equipamentos</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#f1f5f9; --card:#fff; --ink:#0f172a; --ink2:#475569; --ink3:#94a3b8; --line:#e2e8f0;
  --head:#0f172a; --acc:#1d4ed8; --acc2:#dbeafe; --ok:#16a34a; --warn:#d97706; --bad:#dc2626;
  --r:12px; --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
a{color:var(--acc);text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
.hide{display:none!important}
/* topo */
header.top{position:sticky;top:0;z-index:20;background:var(--head);color:#fff;display:flex;align-items:center;gap:12px;padding:10px 16px}
header.top .marca{font-weight:700;letter-spacing:.2px;white-space:nowrap}
header.top .marca small{display:block;font-weight:400;color:#94a3b8;font-size:12px}
header.top nav{display:flex;gap:4px;margin-left:auto}
header.top nav a{color:#cbd5e1;padding:8px 12px;border-radius:8px;font-size:14px}
header.top nav a.on,header.top nav a:hover{background:#1e293b;color:#fff}
.papel{font-size:11px;padding:2px 8px;border-radius:99px;background:#334155;color:#e2e8f0;margin-left:6px}
nav.baixo{display:none}
@media (max-width:760px){
  header.top nav{display:none}
  nav.baixo{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:20;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
  nav.baixo a{flex:1;text-align:center;padding:9px 2px 7px;font-size:11px;color:var(--ink2)}
  nav.baixo a b{display:block;font-size:18px;line-height:1.1}
  nav.baixo a.on{color:var(--acc)}
  main{padding-bottom:80px!important}
}
main{max-width:1180px;margin:0 auto;padding:18px 16px 40px}
h1{font-size:22px;margin:4px 0 2px}
h2{font-size:16px;margin:22px 0 10px}
.sub{color:var(--ink2);font-size:13px}
.trilha{font-size:13px;color:var(--ink2);margin-bottom:6px}
.trilha a{color:var(--ink2)} .trilha a:hover{color:var(--acc)}
.linha{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.esp{flex:1}
/* botões */
.bt{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:#fff;padding:9px 14px;border-radius:10px;cursor:pointer;font-weight:600;font-size:14px;white-space:nowrap}
.bt:hover{border-color:#cbd5e1;background:#f8fafc}
.bt.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.bt.pri:hover{background:#1e40af}
.bt.per{color:var(--bad);border-color:#fecaca}
.bt.peq{padding:6px 10px;font-size:13px}
.bt[disabled]{opacity:.55;cursor:wait}
/* cards e kpis */
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.kpi .n{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.kpi .n small{font-size:14px;color:var(--ink3);font-weight:500}
.kpi .l{font-size:12px;color:var(--ink2);text-transform:uppercase;letter-spacing:.4px}
.kpi.alerta .n{color:var(--bad)} .kpi.aviso .n{color:var(--warn)}
.barra{height:6px;background:#e2e8f0;border-radius:99px;overflow:hidden;margin-top:8px}
.barra i{display:block;height:100%;background:var(--ok);border-radius:99px}
.grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.bloco{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:block;color:inherit}
a.bloco:hover{border-color:var(--acc);box-shadow:0 1px 0 var(--acc)}
.bloco .t{font-weight:700;font-size:18px}
.bloco .m{font-size:12px;color:var(--ink2);margin-top:2px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.tg{font-size:11px;padding:2px 8px;border-radius:99px;background:#f1f5f9;color:var(--ink2);font-weight:600;white-space:nowrap;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;letter-spacing:0}
.tg.bad{background:#fee2e2;color:#b91c1c} .tg.warn{background:#fef3c7;color:#92400e} .tg.ok{background:#dcfce7;color:#166534} .tg.info{background:var(--acc2);color:#1e40af}
/* cards de posição */
.posicoes{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
.pos{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column}
.pos.incompleta{border-left:4px solid #cbd5e1}
.pos.completa{border-left:4px solid var(--ok)}
.pos.alerta{border-left:4px solid var(--bad)}
.pos .cab{padding:12px 14px 10px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start}
.item{flex:none;width:30px;height:30px;border-radius:50%;background:var(--head);color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px}
.pos .nome{font-weight:700}
.pos .loc{font:12px var(--mono);color:var(--ink2)}
.peca{display:grid;grid-template-columns:78px minmax(0,1fr);gap:2px 10px;padding:9px 14px;border-bottom:1px dashed var(--line);align-items:center;cursor:pointer}
.peca .lin{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;min-width:0}
.peca .lin .st{white-space:normal}
.peca:hover{background:#f8fafc}
.peca.vazia{cursor:default;background:repeating-linear-gradient(45deg,#fff,#fff 8px,#f8fafc 8px,#f8fafc 16px)}
.peca .tp{font-size:11px;font-weight:700;color:var(--ink2);text-transform:uppercase;letter-spacing:.4px}
.peca .sn{font:600 16px var(--mono);letter-spacing:.5px;white-space:nowrap}
.peca .det{grid-column:2;font-size:12px;color:var(--ink2)}
.peca .falta{color:var(--ink3);font-size:13px;font-style:italic}
.pos .rod{padding:10px 14px;margin-top:auto;display:flex;gap:8px;align-items:center}
.st{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;background:#f1f5f9;white-space:nowrap}
.st::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c,#64748b)}
.nivel{font-size:12px;font-weight:700;color:var(--ink2);text-transform:uppercase;letter-spacing:.6px;margin:18px 0 8px;display:flex;align-items:center;gap:8px}
.nivel::after{content:"";flex:1;height:1px;background:var(--line)}
/* listas */
.lista{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.lista .li{display:flex;gap:12px;align-items:center;padding:11px 14px;border-bottom:1px solid var(--line);color:inherit}
.lista .li:last-child{border-bottom:0}
.lista a.li:hover{background:#f8fafc}
.mono{font-family:var(--mono)}
.vazio{padding:28px;text-align:center;color:var(--ink2)}
/* dossiê */
.ficha{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.ficha div{background:#fff;padding:10px 14px;box-shadow:1px 1px 0 var(--line)}
.ficha dt{font-size:11px;color:var(--ink2);text-transform:uppercase;letter-spacing:.4px}
.ficha dd{margin:2px 0 0;font-weight:600;word-break:break-word}
.tempo{border-left:2px solid var(--line);margin-left:8px;padding-left:18px}
.ev{position:relative;padding:0 0 16px}
.ev::before{content:"";position:absolute;left:-25px;top:4px;width:12px;height:12px;border-radius:50%;background:var(--c,#64748b);border:2px solid #fff;box-shadow:0 0 0 1px var(--line)}
.ev .q{font-size:12px;color:var(--ink2)}
.ev .o{font-weight:600}
.ev .d{font-size:13px;color:var(--ink2);white-space:pre-wrap}
/* formulários */
.campo{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.campo label{font-size:13px;font-weight:600;color:var(--ink2)}
.campo input,.campo select,.campo textarea{border:1px solid #cbd5e1;border-radius:9px;padding:10px 12px;background:#fff;width:100%}
.campo input:focus,.campo select:focus,.campo textarea:focus{outline:2px solid var(--acc2);border-color:var(--acc)}
.campo .dica{font-size:12px;color:var(--ink3)}
input.sninput{font:600 18px var(--mono);letter-spacing:1px}
.dupla{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chk{display:flex;gap:8px;align-items:center;font-size:14px;margin:4px 0 10px;cursor:pointer}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;margin-bottom:10px}
.seg label{padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer;color:var(--ink2)}
.seg input{display:none}
.seg input:checked+span{color:#fff}
.seg label:has(input:checked){background:var(--acc);color:#fff}
fieldset.pc{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px 4px;margin:0 0 12px}
fieldset.pc legend{font-weight:700;padding:0 6px}
.busca{display:flex;gap:8px}
.busca input{flex:1;border:1px solid #cbd5e1;border-radius:10px;padding:11px 14px;font-size:16px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:5px 12px;font-size:13px;cursor:pointer}
.chip.on{background:var(--head);color:#fff;border-color:var(--head)}
/* modal e avisos */
.fundo{position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:4vh 12px}
.modal{background:#fff;border-radius:16px;width:100%;max-width:560px;box-shadow:0 20px 50px rgba(0,0,0,.25);max-height:92vh;display:flex;flex-direction:column}
.modal .mc{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center}
.modal .mc h3{margin:0;font-size:17px;flex:1}
.modal .mb{padding:16px 18px;overflow:auto;flex:1}
.modal .mr{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;background:#fff;border-radius:0 0 16px 16px}
.x{border:0;background:none;font-size:22px;cursor:pointer;color:var(--ink2);line-height:1}
.erro{background:#fef2f2;border:1px solid #fecaca;color:#991b1b;padding:10px 12px;border-radius:10px;font-size:14px;margin-bottom:12px;white-space:pre-wrap}
.info{background:#eff6ff;border:1px solid #bfdbfe;color:#1e3a8a;padding:10px 12px;border-radius:10px;font-size:13px;margin-bottom:12px}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--head);color:#fff;padding:11px 18px;border-radius:12px;font-size:14px;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:92vw}
.carregando{padding:40px;text-align:center;color:var(--ink2)}
/* relatório */
.filtros-rel{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px 10px;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin:12px 0}
.filtros-rel .campo{margin:0}
.filtros-rel .campo select{padding:7px 10px}
.rel-wrap{background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:auto}
table.rel{width:100%;border-collapse:collapse;font-size:12.5px}
table.rel th{background:var(--head);color:#fff;text-align:left;padding:7px 8px;font-size:11px;text-transform:uppercase;letter-spacing:.3px;white-space:nowrap;position:sticky;top:0}
table.rel td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
table.rel tr:nth-child(even) td{background:#f8fafc}
table.rel .sn{font:600 12.5px var(--mono);white-space:nowrap}
table.rel .s{display:block;font-size:10.5px;color:var(--ink2);white-space:nowrap}
table.rel .s i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:4px;background:var(--c)}
table.rel .fl{color:var(--ink3);font-style:italic}
table.rel .s.sit{font-size:12px;color:var(--ink)}
.so-impressao{display:none!important}
.rel-cab{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:3px solid var(--head);padding-bottom:8px;margin-bottom:10px}
.rel-cab h1{font-size:18px;margin:0}
.rel-cab .meta{font-size:11px;color:var(--ink2);text-align:right}
.rel-kpis{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:8px 0 14px}
.rel-kpis div{border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.rel-kpis b{display:block;font-size:17px}
.rel-kpis span{font-size:10px;color:var(--ink2);text-transform:uppercase}
.assin{display:grid;grid-template-columns:repeat(var(--n,3),1fr);gap:36px;margin-top:54px;font-size:11px;text-align:center;color:var(--ink2);break-inside:avoid}
.assin > div{border-top:1px solid var(--ink);padding-top:6px}
.assin b{display:block;color:var(--ink);font-size:11.5px}
.assin .dt{margin-top:10px;font-size:10px}
body.retrato .assin{grid-template-columns:repeat(min(var(--n,3),2),1fr);row-gap:44px}
.assin-ed{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin:0 0 12px}
.assin-ed summary{cursor:pointer;font-weight:600;font-size:14px}
.assin-ed .lin4{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin-top:10px}
.assin-ed .lin4 > div{border:1px dashed var(--line);border-radius:10px;padding:8px 10px}
.assin-ed input{width:100%;border:1px solid #cbd5e1;border-radius:8px;padding:7px 9px;margin-top:4px}
@media (max-width:760px){.rel-kpis{grid-template-columns:repeat(2,1fr)}}
@media print{
  @page{size:A4 landscape;margin:9mm}
  html,body{background:#fff!important;font-size:11px}
  .so-impressao.rel-cab{display:flex!important}
  .so-impressao.assin{display:grid!important}
  header.top,nav.baixo,.nao-imprimir,#toast{display:none!important}
  main{max-width:none;padding:0!important}
  .so-impressao{display:block!important}
  .rel-wrap{border:0;overflow:visible}
  table.rel{font-size:9.5px}
  table.rel th{position:static;background:#0f172a!important;color:#fff!important;-webkit-print-color-adjust:exact;print-color-adjust:exact;font-size:8.5px;padding:5px 6px}
  table.rel td{padding:4px 6px}
  table.rel .sn{font-size:9.5px}
  table.rel .s.sit{font-size:9.5px}
  table.rel tr{break-inside:avoid}
  table.rel tr:nth-child(even) td,.rel-kpis div,table.rel .s i{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .rel-kpis b{font-size:14px}
  body.retrato table.rel .rx{display:none}
  body.retrato table.rel{font-size:8.5px}
  body.retrato table.rel th{font-size:7.5px;padding:4px 4px}
  body.retrato table.rel td{padding:3px 4px}
  body.retrato table.rel .sn{font-size:8.5px}
  body.retrato table.rel .s{font-size:7.5px}
  body.retrato table.rel .s.sit{font-size:8.5px}
  body.retrato .rel-kpis{grid-template-columns:repeat(4,1fr)}
  body.retrato .rel-cab h1{font-size:15px}
}
/* login */
.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(160deg,#0f172a,#1e3a8a)}
.login form{background:#fff;border-radius:18px;padding:26px 24px;width:100%;max-width:380px}
.login h1{margin:0 0 4px}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th,table.t td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
table.t th{font-size:12px;color:var(--ink2);text-transform:uppercase}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="hide"></div>

<script>
/* =====================================================================
   CONFIGURAÇÃO — projeto Supabase
   A chave "publishable" é pública por natureza: a proteção dos dados é
   feita pelo login + regras de segurança (RLS) do banco.
   ===================================================================== */
const SUPABASE_URL = 'https://fbeacviripkyieonzdyb.supabase.co';
const SUPABASE_KEY = 'sb_publishable_SHNlvhnVf0XT0ioIYw8FpQ_DS8F8ZXt';
const VERSAO = 'v0.5 · Filtros A01–F12 e assinaturas editáveis';

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

/* ---------- estado ---------- */
const S = { sessao:null, perfil:null, ref:null, posicoes:null, equip:null };
const TIPOS_ORDEM = ['VALVULA','ATUADOR','REDUTOR','SOPRADOR','OUTRO'];
const FAB_PADRAO = { VALVULA:'Interativa', ATUADOR:'Coester', REDUTOR:'Coester' };
const ROTULO_CAMPO = {
  torque_nm:'Torque (N·m)', rotacao_rpm:'Rotação (rpm)', tensao_v:'Tensão (V)', corrente_a:'Corrente (A)',
  potencia_kw:'Potência (kW)', frequencia_hz:'Frequência (Hz)', grau_protecao_ip:'Grau de proteção (IP)',
  tipo_comando:'Tipo de comando', relacao_reducao:'Relação de redução', torque_saida_nm:'Torque de saída (N·m)',
  tipo_redutor:'Tipo de redutor', tipo_valvula:'Tipo de válvula', tamanho_pol:'Tamanho (pol)', pressao_pn:'Pressão (PN)',
  material_corpo:'Material do corpo', material_disco:'Material do disco', material_vedacao:'Material da vedação',
  vazao_m3h:'Vazão (m³/h)', pressao_mbar:'Pressão (mbar)', diametro_dn:'Diâmetro (DN)'
};
const SITUACAO_SN = { PENDENTE:'Pendente (não conferido)', ILEGIVEL:'Placa ilegível', SEM_PLACA:'Sem placa (caiu/ausente)' };
const EVENTO = {
  INSTALACAO:['Instalação','#0ea5e9'], RETIRADA:['Retirada','#78716c'], OCORRENCIA:['Ocorrência','#dc2626'],
  SUBSTITUIDO_POR:['Substituído','#57534e'], SUBSTITUIU:['Substituição','#16a34a']
};
const DEFEITO = ['COM_DEFEITO','AGUARDANDO_MANUTENCAO'];

/* ---------- utilidades ---------- */
const $ = (s, el=document) => el.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pode = () => ['admin','editor'].includes(S.perfil?.papel);
const admin = () => S.perfil?.papel === 'admin';
const hoje = () => { const d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset()*60000).toISOString().slice(0,10); };
const fmtD = v => v ? new Date(v.length === 10 ? v + 'T12:00:00' : v).toLocaleDateString('pt-BR') : '—';
const fmtDH = v => v ? new Date(v).toLocaleString('pt-BR', {dateStyle:'short', timeStyle:'short'}) : '—';
const dataParaTs = d => (!d || d === hoje()) ? new Date().toISOString() : d + 'T12:00:00-03:00';
const tipoNome = c => S.ref.tipos.find(t => t.codigo === c)?.nome || c;
const stInfo = c => S.ref.status.find(s => s.codigo === c) || { nome:c, cor:'#64748b' };
const pill = c => { const s = stInfo(c); return `<span class="st" style="--c:${esc(s.cor)}">${esc(s.nome)}</span>`; };
const nomeUsuario = id => S.ref.perfis.find(p => p.user_id === id)?.nome || (id ? 'usuário' : 'sistema');

function msgErro(e) {
  const m = (e && (e.message || e.error_description || e.msg)) || String(e);
  if (/ux_equipamentos_sn/.test(m)) return 'Já existe uma peça deste tipo e fabricante com este SN.\nConfira a placa. Se for a mesma peça, procure-a pela Busca.';
  if (/Invalid login credentials/i.test(m)) return 'E-mail ou senha incorretos.';
  if (/row-level security|permission denied/i.test(m)) return 'Você não tem permissão para esta operação.';
  if (/Failed to fetch|NetworkError|Load failed/i.test(m)) return 'Sem conexão com o servidor. Verifique a internet e tente de novo.';
  if (/Password should be/i.test(m)) return 'A senha deve ter pelo menos 8 caracteres.';
  return m;
}
function toast(t, ms=3500) {
  const el = $('#toast'); el.textContent = t; el.classList.remove('hide');
  clearTimeout(toast._t); toast._t = setTimeout(() => el.classList.add('hide'), ms);
}
async function q(promise) { const { data, error } = await promise; if (error) throw error; return data; }
async function buscarTodos(fn) {
  let todos = [], de = 0; const passo = 1000;
  for (;;) { const lote = await q(fn().range(de, de + passo - 1)); todos = todos.concat(lote); if (lote.length < passo) break; de += passo; }
  return todos;
}

/* ---------- carga de dados ---------- */
async function carregarRef() {
  const [tipos, status, fabricantes, obras, perfis] = await Promise.all([
    q(sb.from('tipos_equipamento').select('*')),
    q(sb.from('status_equipamento').select('*').order('ordem')),
    q(sb.from('fabricantes').select('*').order('nome')),
    q(sb.from('obras').select('*').order('codigo')),
    q(sb.from('perfis').select('*').order('nome')),
  ]);
  tipos.sort((a,b) => TIPOS_ORDEM.indexOf(a.codigo) - TIPOS_ORDEM.indexOf(b.codigo));
  S.ref = { tipos, status, fabricantes, obras, perfis };
  S.perfil = perfis.find(p => p.user_id === S.sessao.user.id) || { nome: S.sessao.user.email, papel:'leitor' };
}
async function carregarPosicoes(forcar) {
  if (S.posicoes && !forcar) return S.posicoes;
  S.posicoes = await buscarTodos(() => sb.from('vw_posicoes').select('*')
    .order('galeria', { ascending:true }).order('filtro_numero', { ascending:true }).order('item', { ascending:true }));
  return S.posicoes;
}
async function carregarEquip(forcar) {
  if (S.equip && !forcar) return S.equip;
  S.equip = await buscarTodos(() => sb.from('vw_equipamentos')
    .select('id,tag_rastreio,tipo_codigo,numero_serie,sn_pendente,situacao_sn,fabricante,modelo,status_codigo,posicao_id,tag_local,tag_consorcio,galeria,filtro,posicao_descricao,instalado_em,instalacao_data_estimada,observacoes,total_ocorrencias,ocorrencias_abertas,ocorrencias_agua,garantia_ate,nota_fiscal')
    .order('tag_rastreio', { ascending:true }));
  return S.equip;
}
function invalidar() { S.posicoes = null; S.equip = null; }

/* ---------- cálculos ---------- */
function resumoPos(lista) {
  let prev = 0, inst = 0, defeito = 0, semSn = 0;
  for (const p of lista) {
    prev += p.tipos_previstos.length; inst += p.tipos_previstos.length - p.tipos_pendentes.length;
    for (const k of ['valvula','atuador','redutor']) if (DEFEITO.includes(p[k + '_status'])) defeito++;
    semSn += Number(p.pecas_sem_sn || 0);
  }
  return { prev, inst, defeito, semSn, pct: prev ? Math.round(inst * 100 / prev) : 0 };
}
const barra = pct => `<div class="barra"><i style="width:${pct}%"></i></div>`;

/* ---------- painel ---------- */
async function telaPainel() {
  const [pos, eq] = await Promise.all([carregarPosicoes(), carregarEquip()]);
  const r = resumoPos(pos);
  const conta = (tipo) => {
    const prev = pos.filter(p => p.tipos_previstos.includes(tipo)).length;
    const inst = pos.filter(p => p.tipos_previstos.includes(tipo) && !p.tipos_pendentes.includes(tipo)).length;
    return { prev, inst };
  };
  const v = conta('VALVULA'), a = conta('ATUADOR'), rd = conta('REDUTOR');
  const defeito = eq.filter(e => DEFEITO.includes(e.status_codigo));
  const semSn = eq.filter(e => e.sn_pendente);
  const estoque = eq.filter(e => !e.posicao_id && e.status_codigo !== 'BAIXADO');
  const galerias = [...new Set(pos.filter(p => p.galeria).map(p => p.galeria))];
  const kpi = (n, de, l, cls='') => `<div class="kpi ${cls}"><div class="n">${n}${de != null ? ` <small>/ ${de}</small>` : ''}</div><div class="l">${l}</div>${de ? barra(Math.round(n*100/de)) : ''}</div>`;
  return moldura('painel', `
    <h1>Painel</h1><div class="sub">${pos.length} posições · ${r.inst} de ${r.prev} peças instaladas (${r.pct}%)</div>
    <h2>Instalação</h2>
    <div class="kpis">
      ${kpi(v.inst, v.prev, 'Válvulas')}${kpi(a.inst, a.prev, 'Atuadores')}${kpi(rd.inst, rd.prev, 'Redutores')}
    </div>
    <h2>Atenção</h2>
    <div class="kpis">
      ${kpi(defeito.length, null, 'Com defeito / aguardando manutenção', defeito.length ? 'alerta' : '')}
      ${kpi(semSn.length, null, 'Peças com SN pendente', semSn.length ? 'aviso' : '')}
      ${kpi(estoque.length, null, 'Peças fora de posição (estoque)')}
    </div>
    ${defeito.length ? `<h2>Peças com defeito</h2><div class="lista">${defeito.slice(0, 15).map(linhaEquip).join('')}</div>` : ''}
    <h2>Galerias</h2>
    <div class="grade">${galerias.map(g => {
      const rg = resumoPos(pos.filter(p => p.galeria === g));
      return `<a class="bloco" href="#/g/${esc(g)}"><div class="t">Galeria ${esc(g)}</div>
        <div class="m">${rg.inst} de ${rg.prev} peças · ${rg.pct}%</div>${barra(rg.pct)}
        <div class="tags">${rg.defeito ? `<span class="tg bad">${rg.defeito} com defeito</span>` : ''}${rg.semSn ? `<span class="tg warn">${rg.semSn} sem SN</span>` : ''}</div></a>`;
    }).join('')}</div>`);
}

function linhaEquip(e) {
  const local = e.tag_local ? `${esc(e.tag_local)} · ${esc(e.posicao_descricao || '')}` : 'Fora de posição';
  return `<a class="li" href="#/e/${e.id}">
    <div style="min-width:0;flex:1">
      <div><b class="mono">${esc(e.tag_rastreio)}</b> · ${esc(tipoNome(e.tipo_codigo))} · ${esc(e.fabricante)}</div>
      <div class="sub">SN ${e.numero_serie ? `<b class="mono">${esc(e.numero_serie)}</b>` : '<span class="tg warn">pendente</span>'} · ${local}</div>
      ${filtroBusca === 'conferir' && (e.sn_observacao || /^CONFERIR/.test(e.observacoes || '')) ? `<div class="sub" style="color:#92400e">${esc(!e.numero_serie ? e.sn_observacao : e.observacoes)}</div>` : ''}

    }).join('') || '<div class="vazio">Nenhum filtro nesta galeria.</div>'}</div>`);
}

/* ---------- filtro (8 posições) ---------- */
async function telaFiltro(g, n) {
  const pos = await carregarPosicoes();
  const pf = pos.filter(p => p.galeria === g && p.filtro_numero === Number(n));
  if (!pf.length) return moldura('filtros', '<div class="vazio">Filtro não encontrado.</div>');
  const rf = resumoPos(pf);
  const nums = [...new Set(pos.filter(p => p.galeria === g).map(p => p.filtro_numero))].sort((a,b) => a - b);
  const i = nums.indexOf(Number(n));
  const ant = nums[i - 1], prox = nums[i + 1];
  const grupo = nivel => pf.filter(p => (p.nivel || 'INFERIOR') === nivel);
  const bloco = (nivel, rot) => grupo(nivel).length ? `<div class="nivel">${rot}</div><div class="posicoes">${grupo(nivel).map(cardPosicao).join('')}</div>` : '';
  return moldura('filtros', `
    <div class="trilha"><a href="#/">Painel</a> › <a href="#/g/${esc(g)}">Galeria ${esc(g)}</a> › ${esc(pf[0].filtro)}</div>
    <div class="linha"><h1>Galeria ${esc(g)} · ${esc(pf[0].filtro)}</h1><span class="esp"></span>
      ${ant ? `<a class="bt peq" href="#/f/${esc(g)}/${ant}">‹ ${esc(g)}${String(ant).padStart(2,'0')}</a>` : ''}
      ${prox ? `<a class="bt peq" href="#/f/${esc(g)}/${prox}">${esc(g)}${String(prox).padStart(2,'0')} ›</a>` : ''}</div>
    <div class="sub">${rf.inst} de ${rf.prev} peças instaladas (${rf.pct}%)${rf.semSn ? ` · <span class="tg warn">${rf.semSn} sem SN</span>` : ''}</div>
    ${barra(rf.pct)}
    ${bloco('INFERIOR', 'Galeria inferior')}${bloco('SUPERIOR', 'Galeria superior')}`);
}

function cardPosicao(p) {
  const temDefeito = ['valvula','atuador','redutor'].some(k => DEFEITO.includes(p[k + '_status']));
  const cls = temDefeito ? 'alerta' : (p.tipos_pendentes.length ? 'incompleta' : 'completa');
  const pecas = p.tipos_previstos.slice().sort((a,b) => TIPOS_ORDEM.indexOf(a) - TIPOS_ORDEM.indexOf(b)).map(t => {
    const k = t.toLowerCase();
    if (!p[k + '_id']) return `<div class="peca vazia"><span class="tp">${esc(tipoNome(t))}</span><span class="falta">não instalado</span></div>`;
    const sn = p[k + '_sn'];
    const dadosExtra = [p[k + '_fabricante'], p[k + '_tag']].filter(Boolean).map(esc).join(' · ');
    return `<div class="peca" data-ir="#/e/${p[k + '_id']}" role="link" tabindex="0">
      <span class="tp">${esc(tipoNome(t))}</span>
      <span class="lin"><span class="sn">${sn ? esc(sn) : '<span class="tg warn">SN pendente</span>'}</span>${pill(p[k + '_status'])}</span>
      <span class="tp"></span><span class="det">${dadosExtra}${p[k + '_modelo'] ? ' · ' + esc(p[k + '_modelo']) : ''}</span></div>`;
  }).join('');
  const faltam = p.tipos_pendentes.map(tipoNome).join(', ');
  return `<div class="pos ${cls}">
    <div class="cab"><span class="item">${esc(p.item ?? '•')}</span>
      <div style="flex:1;min-width:0"><div class="nome">${esc(p.descricao)}</div>
      <div class="loc">${esc(p.tag_local)}${p.tag_consorcio ? ' · CEDAE: ' + esc(p.tag_consorcio) : ''}</div></div>
      ${p.ocorrencias_abertas > 0 ? `<span class="tg bad">${p.ocorrencias_abertas} ocorr.</span>` : ''}</div>
    ${pecas}
    <div class="rod">
      ${p.tipos_pendentes.length ? `<span class="sub">Falta: ${esc(faltam)}</span>` : '<span class="tg ok">Conjunto completo</span>'}
      <span class="esp"></span>
      ${pode() && p.tipos_pendentes.length ? `<button class="bt pri peq" data-registrar="${p.posicao_id}">+ Registrar peças</button>` : ''}
    </div></div>`;
}

/* ---------- registrar peças de uma posição ---------- */
async function abrirRegistrar(posId) {
  const p = S.posicoes.find(x => x.posicao_id === posId);
  const tipos = p.tipos_pendentes.slice().sort((a,b) => TIPOS_ORDEM.indexOf(a) - TIPOS_ORDEM.indexOf(b));
  const eq = await carregarEquip();
  const estoque = t => eq.filter(e => e.tipo_codigo === t && !e.posicao_id && e.status_codigo !== 'BAIXADO');
  const fabOpts = t => S.ref.fabricantes.map(f => `<option value="${f.id}" ${f.nome === FAB_PADRAO[t] ? 'selected' : ''}>${esc(f.nome)}</option>`).join('');
  const blocoTipo = t => {
    const tp = S.ref.tipos.find(x => x.codigo === t); const est = estoque(t);
    return `<fieldset class="pc" data-tipo="${t}"><legend>${esc(tp.nome)}</legend>
      ${est.length ? `<div class="seg"><label><input type="radio" name="${t}_modo" value="nova" checked><span>Nova peça</span></label><label><input type="radio" name="${t}_modo" value="estoque"><span>Do estoque (${est.length})</span></label></div>` : `<input type="hidden" name="${t}_modo" value="nova">`}
      <div data-painel="nova">
        <div class="dupla">
          <div class="campo"><label>Fabricante</label><select name="${t}_fab">${fabOpts(t)}</select></div>
          <div class="campo"><label>SN da placa</label><input class="sninput" name="${t}_sn" autocomplete="off" ${tp.formato_sn === '^[0-9]{5}$' ? 'inputmode="numeric" maxlength="5"' : ''} placeholder="${esc(tp.formato_sn_descricao ? tp.formato_sn_descricao.replace(/^.*ex\.:\s*/,'').replace(/\)$/,'') : '')}"></div>
        </div>
        ${tp.formato_sn_descricao ? `<div class="campo" style="margin-top:-8px"><span class="dica">Formato: ${esc(tp.formato_sn_descricao)}</span></div>` : ''}
        <label class="chk"><input type="checkbox" name="${t}_semsn"> Sem SN (placa caiu, ilegível ou não conferida)</label>
        <div data-semsn class="hide">
          <div class="campo"><label>Situação</label><select name="${t}_situacao">${Object.entries(SITUACAO_SN).map(([k,v]) => `<option value="${k}" ${k === 'SEM_PLACA' ? 'selected' : ''}>${v}</option>`).join('')}</select></div>
          <div class="campo"><label>Motivo / observação (obrigatório)</label><input name="${t}_motivo" placeholder="Ex.: placa caiu durante a montagem"></div>
        </div>
        ${t === 'VALVULA' ? `<div class="dupla"><div class="campo"><label>Tipo de válvula</label><input name="${t}_tipo_valvula" value="Borboleta"></div><div class="campo"><label>Tamanho (pol)</label><input name="${t}_tamanho_pol" inputmode="decimal" placeholder="28"></div></div>` : ''}
      </div>
      ${est.length ? `<div data-painel="estoque" class="hide"><div class="campo"><label>Peça em estoque</label><select name="${t}_estoque"><option value="">Selecione…</option>${est.map(e => `<option value="${e.id}">${esc(e.tag_rastreio)} · SN ${esc(e.numero_serie || 'pendente')} · ${esc(e.fabricante)} · ${esc(stInfo(e.status_codigo).nome)}</option>`).join('')}</select></div></div>` : ''}
    </fieldset>`;
  };
  const corpo = `
    <div class="sub" style="margin-bottom:12px"><b class="mono">${esc(p.tag_local)}</b> · ${esc(p.descricao)}</div>
    <div class="info">Preencha só as peças que você está registrando agora. As que ficarem em branco continuam pendentes.</div>
    <div data-erro></div>
    ${tipos.map(blocoTipo).join('')}
    <div class="dupla">
      <div class="campo"><label>Data da instalação</label><input type="date" name="data" value="${hoje()}" max="${hoje()}" required></div>
      <div class="campo"><label>Situação</label><select name="status">
        <option value="INSTALADO_NAO_COMISSIONADO">Instalado — não comissionado</option><option value="EM_OPERACAO">Em operação</option></select></div>
    </div>
    <div class="campo"><label>Responsável</label><input name="responsavel" value="${esc(S.perfil.nome)}" required></div>`;
  modal('Registrar peças', corpo, 'Salvar', async (form, mostrarErro) => {
    const f = new FormData(form); const itens = [];
    for (const t of tipos) {
      const tp = S.ref.tipos.find(x => x.codigo === t);
      if (f.get(`${t}_modo`) === 'estoque') {
        if (f.get(`${t}_estoque`)) itens.push({ equipamento_id: f.get(`${t}_estoque`) });
        continue;
      }
      const sn = (f.get(`${t}_sn`) || '').replace(/\s+/g, '').toUpperCase();
      const semSn = f.get(`${t}_semsn`) === 'on';
      if (!sn && !semSn) continue;
      const item = { tipo_codigo: t, fabricante_id: f.get(`${t}_fab`), dados_placa: {} };
      if (semSn) {
        const motivo = (f.get(`${t}_motivo`) || '').trim();
        if (!motivo) return mostrarErro(`${tp.nome}: informe o motivo da falta do SN.`);
        Object.assign(item, { situacao_sn: f.get(`${t}_situacao`), sn_observacao: motivo });
      } else {
        if (tp.formato_sn && !(new RegExp(tp.formato_sn)).test(sn)) return mostrarErro(`${tp.nome}: SN "${sn}" fora do padrão (${tp.formato_sn_descricao}).`);
        item.numero_serie = sn;
      }
      if (t === 'VALVULA') {
        if (f.get('VALVULA_tipo_valvula')) item.dados_placa.tipo_valvula = f.get('VALVULA_tipo_valvula').trim();
        if (f.get('VALVULA_tamanho_pol')) item.dados_placa.tamanho_pol = f.get('VALVULA_tamanho_pol').trim();
      }
      itens.push(item);
    }
    if (!itens.length) return mostrarErro('Nenhuma peça preenchida. Informe o SN, marque "Sem SN" ou escolha do estoque.');
    const res = await q(sb.rpc('instalar_conjunto', {
      p_posicao_id: posId, p_itens: itens, p_responsavel: f.get('responsavel').trim(),
      p_data: dataParaTs(f.get('data')), p_status: f.get('status')
    }));
    invalidar(); await carregarPosicoes(true);
    toast(`${res.length} peça(s) registrada(s): ${res.map(r => r.tag_rastreio).join(', ')}`);
    return true;
  }, el => {
    el.querySelectorAll('fieldset.pc').forEach(fs => {
      fs.addEventListener('change', ev => {
        if (ev.target.name?.endsWith('_modo')) fs.querySelectorAll('[data-painel]').forEach(d => d.classList.toggle('hide', d.dataset.painel !== ev.target.value));
        if (ev.target.name?.endsWith('_semsn')) {
          fs.querySelector('[data-semsn]').classList.toggle('hide', !ev.target.checked);
          const sn = fs.querySelector('.sninput'); sn.disabled = ev.target.checked; if (ev.target.checked) sn.value = '';
        }
      });
    });
  });
}

const CAMPO_AUD = {
  status_codigo:'Status', numero_serie:'SN', situacao_sn:'Situação do SN', sn_observacao:'Observação do SN',
  dados_placa:'Dados de placa', nota_fiscal:'Nota fiscal', fornecedor:'Fornecedor', garantia_ate:'Garantia até',
  data_recebimento:'Recebimento', ano_fabricacao:'Ano de fabricação', observacoes:'Observações',
  fabricante_id:'Fabricante', modelo_id:'Modelo', tipo_codigo:'Tipo'
};
function fmtVal(v, campo) {
  if (v == null || v === '') return '—';
  if (campo === 'status_codigo') return stInfo(v).nome;
  if (campo === 'situacao_sn') return v === 'INFORMADO' ? 'Informado' : (SITUACAO_SN[v] || v);
  if (campo === 'fabricante_id') return S.ref.fabricantes.find(f => f.id === v)?.nome || v;
  if (campo === 'garantia_ate' || campo === 'data_recebimento') return fmtD(v);
  if (typeof v === 'object') { const e = Object.entries(v); return e.length ? e.map(([k, x]) => `${ROTULO_CAMPO[k] || k}: ${x}`).join('; ') : '—'; }
  return String(v);
}

function acoesEquip(acao, e) {

    modal(e.sn_pendente ? 'Informar SN' : 'Corrigir SN', `

  if (acao === 'retirar') {
    const ops = S.ref.status.filter(s => s.exige_instalacao !== true && s.codigo !== 'SUBSTITUIDO');

let filtroBusca = 'todos';
async function telaBusca() {

  let resultado = [], posicoesAchadas = [];
  const limpo = termo.replace(/[,()*%\\]/g, ' ').trim();
  if (limpo || filtroBusca !== 'todos') {
    let qb = sb.from('vw_equipamentos').select('id,tag_rastreio,tipo_codigo,numero_serie,sn_pendente,fabricante,status_codigo,posicao_id,tag_local,posicao_descricao,sn_observacao,observacoes');
    if (limpo) qb = qb.or(['numero_serie','tag_rastreio','fabricante','tag_local','tag_consorcio'].map(c => `${c}.ilike.*${limpo}*`).join(','));
    if (filtroBusca === 'semsn') qb = qb.is('numero_serie', null);

    if (filtroBusca === 'estoque') qb = qb.is('posicao_id', null).neq('status_codigo', 'BAIXADO');
    if (filtroBusca === 'conferir') qb = qb.or('numero_serie.is.null,observacoes.ilike.CONFERIR*');
    resultado = await q(qb.order('tag_local', { ascending:true }).order('tag_rastreio', { ascending:true }).limit(300));
    if (limpo) {
      const pos = await carregarPosicoes();
      const t = limpo.toUpperCase();
      posicoesAchadas = pos.filter(p => (p.tag_local || '').toUpperCase().includes(t) || (p.tag_consorcio || '').toUpperCase().includes(t)).slice(0, 30);

  return moldura('busca', `

    ${posicoesAchadas.length ? `<h2>Posições (${posicoesAchadas.length})</h2><div class="lista">${posicoesAchadas.map(p => `<a class="li" href="#/f/${esc(p.galeria)}/${p.filtro_numero}"><div style="flex:1"><b class="mono">${esc(p.tag_local)}</b> · ${esc(p.descricao)}</div><span class="sub">${p.tipos_previstos.length - p.tipos_pendentes.length}/${p.tipos_previstos.length}</span></a>`).join('')}</div>` : ''}
    ${(limpo || filtroBusca !== 'todos') ? `<h2>Equipamentos (${resultado.length}${resultado.length === 300 ? '+' : ''})</h2>
      <div class="lista">${resultado.map(linhaEquip).join('') || '<div class="vazio">Nada encontrado.</div>'}</div>` : '<div class="sub" style="margin-top:14px">Digite um SN, uma TAG ou um local, ou escolha um filtro acima.</div>'}`);

/* ---------- relatório consolidado ---------- */
function situacaoPos(p) {
  const st = ['valvula','atuador','redutor'].map(k => p[k + '_status']).filter(Boolean);
  if (st.some(x => DEFEITO.includes(x))) return 'DEFEITO';
  if (p.tipos_pendentes.length) return st.length ? 'INCOMPLETA' : 'VAZIA';
  if (Number(p.pecas_sem_sn) > 0) return 'SEM_SN';
  if (st.every(x => x === 'EM_OPERACAO')) return 'OPERACAO';
  return 'INSTALADA';
}
const SIT_POS = {
  OPERACAO:['Em operação','#16a34a'], INSTALADA:['Instalada — não comissionada','#0ea5e9'], SEM_SN:['Completa — SN pendente','#d97706'],
  INCOMPLETA:['Incompleta','#94a3b8'], VAZIA:['Sem peças','#cbd5e1'], DEFEITO:['Com defeito','#dc2626']
};
function parametrosRel() {
  const u = new URLSearchParams(location.hash.split('?')[1] || '');
  return { modo: u.get('modo') || 'posicao', g: u.get('g') || '', f: u.get('f') || '', tipo: u.get('tipo') || '',
           sit: u.get('sit') || '', fab: u.get('fab') || '', folha: u.get('folha') || 'paisagem' };
}
function dadosRelatorio(pr, pos, eq) {
  if (pr.modo === 'posicao') {
    return pos.filter(p => (!pr.g || p.galeria === pr.g) && (!pr.f || String(p.filtro_numero) === pr.f)
      && (!pr.sit || situacaoPos(p) === pr.sit)
      && (!pr.tipo || p.tipos_previstos.includes(pr.tipo))
      && (!pr.fab || ['valvula','atuador','redutor'].some(k => p[k + '_fabricante'] === pr.fab)));
  }
  return eq.filter(e => (!pr.g || e.galeria === pr.g) && (!pr.f || Number(String(e.filtro || '').replace(/\D/g,'')) === Number(pr.f))
    && (!pr.tipo || e.tipo_codigo === pr.tipo) && (!pr.fab || e.fabricante === pr.fab)
    && (!pr.sit || (pr.sit === 'SN_PENDENTE' ? e.sn_pendente : pr.sit === 'FORA' ? !e.posicao_id : e.status_codigo === pr.sit)))
    .sort((a, b) => String(a.tag_local || 'ZZZ').localeCompare(String(b.tag_local || 'ZZZ')) || a.tag_rastreio.localeCompare(b.tag_rastreio));
}
async function telaRelatorio() {
  const pr = parametrosRel();
  const [pos, eq] = await Promise.all([carregarPosicoes(), carregarEquip()]);
  const linhas = dadosRelatorio(pr, pos, eq);
  definirFolha(pr.folha);
  const galerias = [...new Set(pos.filter(p => p.galeria).map(p => p.galeria))];
  const filtrosN = [...new Set(pos.filter(p => !pr.g || p.galeria === pr.g).map(p => p.filtro_numero).filter(Boolean))].sort((a,b) => a - b);

  S.ultimoRel = { pr, linhas, descFiltros };

function exportarCSV() {
  const { pr, linhas, descFiltros } = S.ultimoRel;
  const peca = (p, k) => !p.tipos_previstos.includes(k.toUpperCase()) ? ['n/a',''] : !p[k + '_id'] ? ['não instalado',''] : [p[k + '_sn'] || 'SN pendente', stInfo(p[k + '_status']).nome];
  const cab = pr.modo === 'posicao'
    ? ['Galeria','Filtro','Item','Posição','Nível','TAG local','TAG CEDAE','Válvula SN','Válvula status','Válvula fabricante','Atuador SN','Atuador status','Atuador fabricante','Redutor SN','Redutor status','Redutor fabricante','Situação','Falta','Ocorrências abertas']
    : ['TAG rastreio','Tipo','Fabricante','Modelo','SN','Situação SN','TAG local','Posição','TAG CEDAE','Status','Instalado em','Data estimada','Ocorrências','Ocorrências de água','Nota fiscal','Garantia até'];
  const rows = linhas.map(x => pr.modo === 'posicao'
    ? [x.galeria, x.filtro, x.item, x.descricao, x.nivel, x.tag_local, x.tag_consorcio,
       ...peca(x,'valvula'), x.valvula_fabricante, ...peca(x,'atuador'), x.atuador_fabricante, ...peca(x,'redutor'), x.redutor_fabricante,
       SIT_POS[situacaoPos(x)][0], x.tipos_pendentes.map(tipoNome).join(', '), x.ocorrencias_abertas]
    : [x.tag_rastreio, tipoNome(x.tipo_codigo), x.fabricante, x.modelo, x.numero_serie, x.numero_serie ? 'Informado' : (SITUACAO_SN[x.situacao_sn] || 'Pendente'),
       x.tag_local, x.posicao_descricao, x.tag_consorcio, stInfo(x.status_codigo).nome, x.instalado_em ? fmtD(x.instalado_em) : '', x.instalado_em ? (x.instalacao_data_estimada ? 'Sim' : 'Não') : '',
       x.total_ocorrencias, x.ocorrencias_agua, x.nota_fiscal, x.garantia_ate ? fmtD(x.garantia_ate) : '']);
  const cel = v => { const t = String(v ?? ''); return /[;"\n]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t; };
  const txt = [[`Relatório consolidado de equipamentos — ${S.ref.obras[0]?.nome || ''}`], [`Emitido em ${fmtDH(new Date().toISOString())} por ${S.perfil.nome} — Filtros: ${descFiltros}`], [], cab, ...rows]
    .map(r => r.map(cel).join(';')).join('\r\n');
  const blob = new Blob(['\ufeff' + txt], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = `relatorio_${pr.modo}_${hoje()}.csv`; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  toast('Planilha gerada — abre direto no Excel.');
}

function modal(titulo, corpo, rotuloOk, aoSalvar, aoAbrir) {
  const fundo = document.createElement('div'); fundo.className = 'fundo';
  fundo.innerHTML = `<form class="modal" novalidate>
    <div class="mc"><h3>${esc(titulo)}</h3><button type="button" class="x" aria-label="Fechar">×</button></div>
    <div class="mb">${corpo}</div>
    <div class="mr"><button type="button" class="bt" data-fechar>Cancelar</button><button class="bt pri" type="submit">${esc(rotuloOk)}</button></div></form>`;
  document.body.appendChild(fundo);
  const form = fundo.querySelector('form');
  const fechar = () => fundo.remove();
  fundo.querySelector('.x').onclick = fechar; fundo.querySelector('[data-fechar]').onclick = fechar;
  const caixaErro = () => form.querySelector('[data-erro]') || form.querySelector('.mb');
  const mostrarErro = m => { const c = caixaErro(); c.innerHTML = `<div class="erro">${esc(m)}</div>`; c.scrollIntoView({ block:'nearest' }); return false; };
  form.onsubmit = async ev => {
    ev.preventDefault();
    const obrig = [...form.querySelectorAll('[required]')].find(i => !i.disabled && !String(i.value).trim());
    if (obrig) { obrig.focus(); return mostrarErro('Preencha os campos obrigatórios.'); }
    const b = form.querySelector('[type=submit]'); b.disabled = true; const txt = b.textContent; b.textContent = 'Salvando…';
    try { if (await aoSalvar(form, mostrarErro)) { fechar(); rotear(); } }
    catch (e) { mostrarErro(msgErro(e)); }
    finally { b.disabled = false; b.textContent = txt; }
  };
  if (aoAbrir) aoAbrir(form);
  setTimeout(() => form.querySelector('input:not([type=hidden]):not([type=radio]):not([type=checkbox]),select')?.focus(), 50);
}

let equipAtual = null;
async function rotear() {
  if (!S.sessao) return telaLogin();
  const [rota] = location.hash.replace(/^#/, '').split('?');
  const partes = rota.split('/').filter(Boolean);
  const app = $('#app');
  if (!app.querySelector('main')) app.innerHTML = '<div class="carregando">Carregando…</div>';
  else app.querySelector('main').innerHTML = '<div class="carregando">Carregando…</div>';
  try {
    let html;
    equipAtual = null;
    if (!partes.length) html = await telaPainel();
    else if (partes[0] === 'g') html = await telaGaleria(decodeURIComponent(partes[1] || 'A'));
    else if (partes[0] === 'f') html = await telaFiltro(decodeURIComponent(partes[1]), partes[2]);
    else if (partes[0] === 'e') html = await telaEquip(partes[1]);
    else if (partes[0] === 'busca') html = await telaBusca();
    else if (partes[0] === 'estoque') html = await telaEstoque();
    else if (partes[0] === 'conta') html = await telaConta();
    else if (partes[0] === 'relatorio') html = await telaRelatorio();
    else html = await telaPainel();
    app.innerHTML = html;
    window.scrollTo(0, 0);
  } catch (e) {
    console.error(e);
    if (/JWT|session|token/i.test(e.message || '')) { S.sessao = null; return telaLogin('Sua sessão expirou. Entre novamente.'); }
    app.innerHTML = moldura('', `<div class="erro">Não foi possível carregar: ${esc(msgErro(e))}</div><button class="bt" onclick="rotear()">Tentar de novo</button>`);
  }
}

window.addEventListener('hashchange', rotear);

async function iniciar() {
  try { await carregarRef(); } catch (e) { return telaLogin('Erro ao carregar dados: ' + msgErro(e)); }
  rotear();
}
(async () => {
  const { data } = await sb.auth.getSession();
  S.sessao = data.session;
  sb.auth.onAuthStateChange((ev, sessao) => { if (ev === 'SIGNED_OUT') { S.sessao = null; } else if (sessao) S.sessao = sessao; });
  if (S.sessao) iniciar(); else telaLogin();
})();
</script>
